<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Week to Regatta app icon. Square, 1024x1024 source.
    Composition: stylized sailboat (cyan jib + white main on dark hull)
    on a dark-ocean gradient with wind streaks.
    Convert to PNG via rsvg-convert / ImageMagick / online tool. See
    README.md in this folder for exact commands.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="65%" stop-color="#0c1f38"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2847"/>
      <stop offset="100%" stop-color="#061428"/>
    </linearGradient>
  </defs>

  <!-- background sky-to-ocean gradient -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- horizon glow -->
  <ellipse cx="512" cy="700" rx="520" ry="40" fill="#00d4ff" opacity="0.05"/>

  <!-- wind streaks (top-left and top-right) -->
  <g opacity="0.32" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="120" y1="220" x2="240" y2="220"/>
    <line x1="280" y1="220" x2="360" y2="220"/>
    <line x1="100" y1="290" x2="220" y2="290"/>
    <line x1="700" y1="240" x2="820" y2="240"/>
    <line x1="850" y1="240" x2="940" y2="240"/>
    <line x1="730" y1="300" x2="880" y2="300"/>
  </g>

  <!-- water -->
  <path d="M 0 720 Q 200 705 380 718 T 700 720 T 1024 715 L 1024 1024 L 0 1024 Z" fill="url(#water)"/>

  <!-- water highlights -->
  <g opacity="0.25" stroke="#00d4ff" stroke-width="2" fill="none">
    <path d="M 80 770 Q 200 762 320 770"/>
    <path d="M 380 800 Q 500 792 620 800"/>
    <path d="M 720 850 Q 820 842 920 850"/>
  </g>

  <!-- sailboat group, centered -->
  <g transform="translate(512 600)">
    <!-- mast -->
    <line x1="0" y1="-340" x2="0" y2="0" stroke="#5a7a8a" stroke-width="4" stroke-linecap="round"/>

    <!-- main sail (full white triangle, leeward side) -->
    <path
      d="M 0 -340 Q 100 -200 180 -10 L 0 -10 Z"
      fill="#e8f4f8"
      stroke="#8ba7b8"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- jib (front sail, cyan accent) -->
    <path
      d="M 0 -300 Q -50 -180 -110 -20 L 0 -20 Z"
      fill="#00d4ff"
      opacity="0.92"
      stroke="#0099cc"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- hull -->
    <path
      d="M -200 0 Q -190 35 -150 40 L 170 40 Q 215 35 215 0 L -200 0 Z"
      fill="#0a1628"
      stroke="#00d4ff"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <!-- waterline highlight -->
    <line x1="-180" y1="40" x2="195" y2="40" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
