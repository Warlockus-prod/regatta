<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Week to Regatta app icon, logo "A. Sail" (owner's choice 2026-11-24).
    White mainsail and light blue jib with a gap between them over two wake
    lines, on action blue fading into ink. Mirror of the icon drawn by
    mobile/scripts/render-icon.mjs, which is the source that writes the PNGs.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0b7fb8"/>
      <stop offset="1" stop-color="#123247"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9f1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <path d="M 500 170 L 500 700 L 800 700 C 760 520 650 330 500 170 Z" fill="url(#main)"/>
  <path d="M 470 250 L 470 700 L 250 700 C 300 540 380 380 470 250 Z" fill="#8fd3f2"/>
  <path d="M 150 790 C 330 740 690 740 874 790" stroke="#ffffff" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M 260 862 C 400 830 620 830 764 862" stroke="#8fd3f2" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
