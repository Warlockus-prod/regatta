# Regatta - Sailing Yacht Simulator
# https://regatta.icoffio.com → http://172.17.0.1:4500

server {
    listen 80;
    server_name regatta.icoffio.com;

    # ACME HTTP-01 challenge for Let's Encrypt renewals
    location /.well-known/acme-challenge/ { root /etc/ssl/certs; }

    # Everything else → HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name regatta.icoffio.com;

    ssl_certificate     /etc/ssl/certs/regatta.icoffio.com.crt;
    ssl_certificate_key /etc/ssl/private/regatta.icoffio.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP is pragmatic: allow our own origin + inline styles Next.js emits.
    # Anthropic is not a client-side concern (all AI calls go through our API routes).
    # frame-src: YouTube embeds allowed for /gallery video tiles.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://regatta.icoffio.com https://regatta.icoffio.com; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'" always;

    client_max_body_size 5M;
    proxy_connect_timeout 60;
    proxy_send_timeout    60;
    proxy_read_timeout    60;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://172.17.0.1:4500;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering off;
    }

    # Long-cache static assets (Next.js fingerprints them)
    location /_next/static/ {
        proxy_pass http://172.17.0.1:4500;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Multiplayer WebSocket -> regatta-ws container (port 4502)
    location /ws {
        proxy_pass http://172.17.0.1:4502;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket upgrade
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Long idle keep-alive for a whole race (max 300s) + some slack
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
