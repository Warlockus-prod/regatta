# Version update PRs for the web app, the multiplayer server, their base
# images and the CI actions. Weekly, minor and patch bumps grouped into one PR
# per ecosystem, a low open-PR limit, and no auto-merge: every PR goes through
# CI and a human merge like any other change.
#
# /mobile is deliberately absent: Expo pins react, react-native and the native
# modules to the SDK, so a version bump there is an SDK upgrade done by hand
# (docs/design/mobile/BUILDS.md). Dependabot alerts and security update PRs
# are a repository setting, not this file; once the owner enables them they
# cover /mobile too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ws-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      ws-minor-and-patch:
        update-types: [minor, patch]

  # Base images are pinned as node:22-alpine@sha256:<digest>; Dependabot moves
  # the digest forward when the tag is rebuilt. A Node major (22 -> 24) is
  # ignored here: CI and deploy run the tests on setup-node 22 and never on the
  # image's runtime, so a major bump is a deliberate change made together with
  # node-version in both workflows, not a Dependabot PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /ws-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Actions are pinned by full commit SHA with a version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
