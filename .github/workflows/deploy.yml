name: Deploy to VPS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, sha)'
        required: false
        default: 'main'

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  build-check:
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    name: Build, checks + pre-deploy E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Record the tested commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deployment privilege boundary tests
        run: python3 -m unittest discover -s ops/deploy -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Multiplayer socket lifecycle
        run: npm run test:multiplayer
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Typography (no em/en-dash)
        run: npm run check:dash
      - name: API contract tests
        run: npm run test:api
      - name: Next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Bundle-size budget check
        run: node scripts/check-bundle-size.mjs
      - name: Product navigation routes and search
        run: npx vitest run src/lib/product
      - name: Physics engine tests
        run: npm run test:physics
      - name: 3D camera and sailing target regression tests
        run: npx vitest run src/features/simulator-3d
      - name: Trainer runtime and feedback regression tests
        run: npx vitest run src/features/simulator-v3
      - name: Shared sailing session, rig mechanics and course regression tests
        run: npx vitest run src/features/sailing-lab
      - name: Install locked mobile dependencies for the offline package
        # The bundled WebView resolves React from mobile, not the Next.js tree.
        # Both lockfiles are required to reproduce the shipped native asset.
        run: npm ci --prefix mobile --no-audit --no-fund
      - name: Offline sailing package matches the website source
        run: npm run build:sailing-offline:check
      - name: Radio trainer tests (state machine + scenarios)
        run: npm run test:radio
      # test:radio does not cover src/app/sternik. The oral trainer's grader tests
      # are the guard against telling a candidate they passed with the rule stated
      # backwards - run them or the guard cannot fail a deploy.
      - name: Sternik trainer tests (oral grader)
        run: npx vitest run src/app/sternik
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Pre-deploy E2E (boot the build, run smoke against localhost)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          BASE_URL: http://localhost:3000
        run: |
          # Boot the production build we just made and run the smoke suite
          # against it BEFORE we ship - so a broken build never reaches prod.
          npx next start -p 3000 &
          APP_PID=$!
          # Wait for the app to answer /api/health (up to ~40s)
          up=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "app up after ${i}s"; up=1; break
            fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "FAIL: app did not become healthy in 40s"; kill $APP_PID 2>/dev/null || true; exit 1
          fi
          set +e
          # Full smoke suite minus the AI chat test (needs a live LLM key -
          # covered post-deploy on prod) and multiplayer.spec (needs the ws
          # server + prod nginx /ws upgrade, also covered post-deploy).
          npx playwright test e2e/smoke.spec.ts --grep-invert "AI chat"
          RESULT=$?
          set -e
          kill $APP_PID 2>/dev/null || true
          exit $RESULT
      - name: Upload pre-deploy E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-predeploy
          path: playwright-report/
          retention-days: 14

  publish-images:
    name: Build immutable deployment images
    needs: build-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.images.outputs.app_digest }}
      ws_digest: ${{ steps.images.outputs.ws_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-check.outputs.commit }}
          persist-credentials: false
      - name: Build and publish the tested revision
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build-check.outputs.commit }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u Warlockus-prod --password-stdin
          for item in regatta regatta-ws; do
            context=.
            if [ "$item" = regatta-ws ]; then context=ws-server; fi
            image="ghcr.io/warlockus-prod/$item:$COMMIT"
            docker build --label "org.opencontainers.image.source=https://github.com/Warlockus-prod/regatta" \
              --label "org.opencontainers.image.revision=$COMMIT" -t "$image" "$context"
            docker push "$image"
            digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
            digest="${digest##*@}"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            output=app_digest
            if [ "$item" = regatta-ws ]; then output=ws_digest; fi
            echo "$output=$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    name: Deploy to VPS
    needs: [build-check, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Verify the SSH key is confined to deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          [ "$VPS_USER" = regatta-deploy ]
          options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          set +e
          ssh "${options[@]}" "$VPS_USER@$VPS_HOST" id
          denied=$?
          set -e
          [ "$denied" = 126 ] || { echo 'Forced command boundary failed'; exit 1; }
          if ssh "${options[@]}" "root@$VPS_HOST" true; then
            echo 'The deployment key still permits root SSH'; exit 1
          fi

      - name: Deploy immutable images through the fixed server policy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          COMMIT: ${{ needs.build-check.outputs.commit }}
          APP_DIGEST: ${{ needs.publish-images.outputs.app_digest }}
          WS_DIGEST: ${{ needs.publish-images.outputs.ws_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os; print(json.dumps({"commit":os.environ["COMMIT"],"appDigest":os.environ["APP_DIGEST"],"wsDigest":os.environ["WS_DIGEST"],"token":os.environ["GH_TOKEN"]}))' | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" deploy

      - name: Remove the runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      - name: Smoke-test prod (HTTP 200)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for path in / /game /leaderboard /anatomy /simulator /simulator2 /simulator-v3 /courses /learn/sails /learn/sails/vang /learn/sails/outhaul /radio /radio/obsluga /radio/symulator /radio/zadania /radio/test; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 15 "https://weektoregatta.com$path")
            echo "HTTP $code  $path"
            [ "$code" = "200" ] || { echo "FAIL: $path returned $code"; exit 1; }
          done
          # Microphone must be same-origin allowed for the radio voice trainer.
          # The header comes from the SHARED nginx_server reverse proxy, which is
          # external to this repo's docker-compose and is NOT applied by this
          # deploy. Until regatta.nginx.conf is copied to the shared proxy and it
          # is reloaded (see docs/design/sternik-radio.md), warn instead of fail
          # so an un-reloaded proxy never blocks an otherwise-good deploy.
          policy=$(curl -sSI -m 15 "https://weektoregatta.com/radio/symulator" | tr -d '\r' | grep -i '^permissions-policy:' || true)
          echo "$policy"
          if echo "$policy" | grep -Fq 'microphone=(self)'; then
            echo "OK: microphone is allowed for same-origin radio training"
          else
            echo "WARN: microphone is not allowed yet - reload the shared nginx_server with the updated regatta.nginx.conf to enable the voice trainer on prod"
          fi

  e2e:
    name: Playwright E2E on prod
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Wait briefly for new container to warm up
        run: sleep 10
      - name: Run E2E smoke tests
        run: npx playwright test
        env:
          BASE_URL: https://weektoregatta.com
      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
