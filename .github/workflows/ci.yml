name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Lint + Typography
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      # Advisory until the simulator-v3 lane clears its pre-existing lint
      # errors (14 as of 2026-05). Reports issues without blocking the PR.
      # Flip to blocking once `npm run lint` is clean on main.
      - name: Next lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Typography check (no em-dash / en-dash)
        run: npm run check:dash

      - name: Physics engine tests
        run: npm run test:physics

      - name: Simulator feature tests (V3 runtime etc.)
        run: npx vitest run src/features

      # One golden physics engine (docs/design/SIMULATORS.md): the mobile
      # trainer consumes src/lib/sailing-physics via the @regatta/physics
      # alias. Fail if anyone re-forks the engine into mobile/.
      - name: No duplicate physics engine
        run: |
          extra=$(ls mobile/src/simulator/physics | grep -v '^index.ts$' || true)
          if [ -n "$extra" ]; then
            echo "mobile/src/simulator/physics must contain only the shim index.ts, found: $extra"
            exit 1
          fi

      - name: API contract tests
        run: npm run test:api
