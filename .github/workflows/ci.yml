name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Lint + Typography
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      # Advisory until the simulator-v3 lane clears its pre-existing lint
      # errors (14 as of 2026-05). Reports issues without blocking the PR.
      # Flip to blocking once `npm run lint` is clean on main.
      - name: Next lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Typography check (no em-dash / en-dash)
        run: npm run check:dash

      - name: Physics engine tests
        run: npm run test:physics

      - name: API contract tests
        run: npm run test:api
