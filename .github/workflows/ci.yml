name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more (publish-images,
# deploy) ask for it in their own permissions block.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Lint + Typography
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      # Blocking since 2026-10-19: errors went 129 -> 0 (warnings still allowed).
      - name: Next lint
        run: npm run lint

      - name: Typography check (no em-dash / en-dash)
        run: npm run check:dash

      # The agent-facing map (AGENTS.md / ARCHITECTURE.md / CHANGELOG.md) is
      # what a fresh Claude, Codex or Gemini session reads before touching
      # anything. A stale path there sends the next model confidently to the
      # wrong file, so a moved or undocumented source file fails the build.
      - name: Project map is current
        run: npm run check:map

      # The server physics in ws-server/race-physics.js is generated from the
      # TS engine; fail when the committed copy drifts from its source.
      - name: Generated multiplayer physics matches the TS engine
        run: node scripts/build-race-server.mjs --check

      # The whole unit suite, not a list of folders: a path filter silently
      # skipped every test file added outside it (7 files on 2026-10-18,
      # including rate limits, ws limits and the proxy). Takes about 10 s.
      - name: All unit tests (vitest)
        run: npx vitest run

      # Real socket lifecycle against an isolated local ws-server
      # (scripts/test-multiplayer.mjs). It used to run only in the deploy
      # workflow, so a pull request could not fail on it.
      - name: Multiplayer socket lifecycle
        run: npm run test:multiplayer

      # One golden physics engine (docs/design/SIMULATORS.md): the mobile
      # trainer consumes src/lib/sailing-physics via the @regatta/physics
      # alias. Fail if anyone re-forks the engine into mobile/.
      - name: No duplicate physics engine
        run: |
          extra=$(ls mobile/src/simulator/physics | grep -v '^index.ts$' || true)
          if [ -n "$extra" ]; then
            echo "mobile/src/simulator/physics must contain only the shim index.ts, found: $extra"
            exit 1
          fi


  # The mobile app (mobile/) shipped with NO CI of its own - its lint,
  # typecheck and 92 Jest tests only ran on a developer's laptop, so a broken
  # drill map or an untransformed expo module could reach a build unnoticed.
  # This runs the mobile lane's own gate (`npm run check` = sync-content twins
  # + lint + tsc + jest). Separate job so it runs in parallel with the web one.
  mobile:
    name: Mobile (twins + lint + typecheck + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      # The twin checks rebuild the offline bundles and compare them byte for
      # byte, so they need BOTH dependency trees, in this order:
      #   mobile/node_modules - build-sailing-offline.mjs resolves react and
      #     react-dom with import.meta.resolve from mobile/scripts, which finds
      #     Expo's pinned copies here first. Without them it falls through to the
      #     web tree's React and the bundle no longer matches the committed asset.
      #   root node_modules   - the scripts import esbuild, a devDependency of the
      #     root package.json, to transpile ../../src/data/*.ts. Without it they
      #     die with ERR_MODULE_NOT_FOUND, and build-radio-offline.mjs resolves
      #     its React from the root tree as the committed asset expects.
      # CI does not run on pushes to main, so this only surfaces on a pull request.
      - name: Install root deps (esbuild for the content twins)
        run: npm ci --no-audit --no-fund

      - name: Content twins in sync + lint + typecheck + Jest
        working-directory: mobile
        run: npm run check

  foundation-e2e:
    name: Foundation browser flow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Build the website candidate
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Keep the production bundle budget
        run: node scripts/check-bundle-size.mjs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Foundation checks, save retry and course return on the built candidate
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          npx next start -p 3000 > /tmp/regatta-foundation-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          up=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              up=1; break
            fi
            sleep 1
          done
          [ "$up" = "1" ] || { echo 'Website did not become healthy in 40s'; exit 1; }
          npx playwright test e2e/foundation.spec.ts
      - name: Upload foundation report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-foundation
          path: playwright-report/
          retention-days: 14
