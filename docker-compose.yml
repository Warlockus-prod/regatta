services:
  regatta:
    build:
      context: .
      dockerfile: Dockerfile
    image: regatta:latest
    container_name: regatta
    restart: unless-stopped
    ports:
      # Bind only to docker bridge so the shared nginx_server reverse proxy can reach it
      - "172.17.0.1:4500:3000"
    env_file:
      # Optional — if absent, AI coach falls back to "not configured" message
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - REGATTA_DB_DIR=/data
    volumes:
      - regatta_data:/data

volumes:
  regatta_data:
