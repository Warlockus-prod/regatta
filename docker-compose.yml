services:
  regatta:
    build:
      context: .
      dockerfile: Dockerfile
    image: regatta:latest
    container_name: regatta
    restart: unless-stopped
    ports:
      # Bind only to docker bridge so the shared nginx_server reverse proxy can reach it
      - "172.17.0.1:4500:3000"
    env_file:
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - REGATTA_DB_DIR=/data
    volumes:
      - regatta_data:/data
    healthcheck:
      # Dedicated /api/health endpoint - cheap, no DB/render.
      # wget ships with busybox in node:22-alpine.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  regatta-ws:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    image: regatta-ws:latest
    container_name: regatta-ws
    restart: unless-stopped
    ports:
      - "172.17.0.1:4502:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_INTERNAL_URL=http://regatta:3000
    depends_on:
      - regatta
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  regatta_data:
